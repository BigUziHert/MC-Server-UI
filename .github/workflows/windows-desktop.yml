name: Windows desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          architecture: x64
          package-manager-cache: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer and portable app
        run: pnpm desktop:dist

      - name: Run backend and desktop unit tests
        run: pnpm test

      - name: Install test browser
        run: pnpm exec playwright install chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Smoke-test the packaged desktop app
        run: pnpm test:desktop

      - name: Upload Windows executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MC-Panel-windows-x64
          path: |
            release/MC-Panel-*-Setup-x64.exe
            release/MC-Panel-*-Portable-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-failure-details
          path: |
            test-results/
            release/smoke-results/*.png
          if-no-files-found: ignore
          retention-days: 7
