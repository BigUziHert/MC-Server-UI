appId: com.biguzihert.mcpanel
productName: MC Panel
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: desktop/assets
files:
  - dist/**/*
  - server/index.mjs
  - server/panel-recovery.mjs
  - server/access.mjs
  - server/remote-access.mjs
  - server/remote-tls.mjs
  - server/audit.mjs
  - server/installed-minecraft.mjs
  - server/minecraft-version.mjs
  - server/terminal-jobs.mjs
  - server/import.mjs
  - server/server-setup.mjs
  - server/installation-directory.mjs
  - server/host-directories.mjs
  - server/java-discovery.mjs
  - server/java-installation.mjs
  - server/launcher-stop.mjs
  - server/connection.mjs
  - server/server-icon.mjs
  - server/telemetry.mjs
  - server/recycle-bin.mjs
  - server/backup-archive.mjs
  - server/backup-restore.mjs
  - server/player-history.mjs
  - server/minecraft.mjs
  - server/clean-install.mjs
  - server/runtime-update.mjs
  - server/launchpad-pack-runtime.mjs
  - server/properties.mjs
  - server/text-encoding.mjs
  - server/versions.mjs
  - server/launchpad.mjs
  - server/launchpad-network.mjs
  - server/launchpad-archives.mjs
  - server/launchpad-bundled.mjs
  - server/launchpad-dependency-ranges.mjs
  - server/launchpad-mod-metadata.mjs
  - server/launchpad-removal.mjs
  - server/launchpad-providers.mjs
  - server/launchpad-extra.mjs
  - shared/subuser-permissions.json
  - shared/panel-connection.mjs
  - shared/launchpad-project.mjs
  - desktop/main.mjs
  - desktop/runtime.mjs
  - desktop/updates.mjs
  - desktop/selection.mjs
  - desktop/preferences.mjs
  - desktop/shutdown.mjs
  - desktop/external-links.mjs
  - desktop/remote-panels.mjs
  - desktop/remote-frontend.mjs
  - desktop/permissions.mjs
  - desktop/connections-ipc.mjs
  - desktop/connection-store.mjs
  - desktop/connections-preload.cjs
  - desktop/assets/**/*
  - package.json
asar: true
npmRebuild: false
publish:
  provider: github
  owner: BigUziHert
  repo: MC-Server-UI
  releaseType: prerelease
  channel: dev
win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: MC-Panel-${version}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MC Panel
  deleteAppDataOnUninstall: false
portable:
  artifactName: MC-Panel-${version}-Portable-${arch}.${ext}
