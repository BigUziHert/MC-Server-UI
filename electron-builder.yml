appId: com.biguzihert.mcpanel
productName: MC Panel
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: desktop/assets
files:
  - dist/**/*
  - server/index.mjs
  - desktop/main.mjs
  - desktop/runtime.mjs
  - desktop/assets/**/*
  - package.json
asar: true
npmRebuild: false
win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: MC-Panel-${version}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MC Panel
  deleteAppDataOnUninstall: false
portable:
  artifactName: MC-Panel-${version}-Portable-${arch}.${ext}
